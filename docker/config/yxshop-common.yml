# YXShop 公共配置
yxshop:
  # 应用信息
  app:
    name: YXShop商城系统
    version: 1.0.0
    description: 基于Webman的电商系统
    author: YXShop Team
    website: https://www.yxshop.com
    
  # 版本控制
  version:
    default: basic
    pricing:
      basic:
        name: 开源版
        price: 0
        features:
          - user_management
          - product_management
          - order_management
          - inventory_management
          - payment_management
          - basic_coupon
          - basic_discount
          - basic_promotion
      professional:
        name: 进阶版
        price: 2999
        features:
          - advanced_coupon
          - advanced_discount
          - promotion_management
          - points_system
          - order_batch
          - inventory_warning
          - user_analytics
          - notification_system
          - basic_analytics
      enterprise:
        name: 高级版
        price: 9999
        features:
          - distribution_system
          - multi_warehouse
          - advanced_logistics
          - after_sales_management
          - review_management
          - miniprogram_management
          - system_management
          - advanced_analytics
          - multi_tenant
          - multi_language
          - api_management

  # 支付配置
  payment:
    wechat:
      app_id: ${WECHAT_APP_ID:}
      app_secret: ${WECHAT_APP_SECRET:}
      mch_id: ${WECHAT_MCH_ID:}
      key: ${WECHAT_KEY:}
      notify_url: ${WECHAT_NOTIFY_URL:http://localhost/api/payment/wechat/notify}
      return_url: ${WECHAT_RETURN_URL:http://localhost/payment/return}
    alipay:
      app_id: ${ALIPAY_APP_ID:}
      private_key: ${ALIPAY_PRIVATE_KEY:}
      public_key: ${ALIPAY_PUBLIC_KEY:}
      notify_url: ${ALIPAY_NOTIFY_URL:http://localhost/api/payment/alipay/notify}
      return_url: ${ALIPAY_RETURN_URL:http://localhost/payment/return}

  # 短信配置
  sms:
    driver: aliyun
    aliyun:
      access_key_id: ${SMS_ALIYUN_ACCESS_KEY_ID:}
      access_key_secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:}
      sign_name: ${SMS_ALIYUN_SIGN_NAME:YXShop}
      template_code: ${SMS_ALIYUN_TEMPLATE_CODE:}

  # 邮件配置
  mail:
    driver: smtp
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    encryption: ${MAIL_ENCRYPTION:tls}
    from:
      address: ${MAIL_FROM_ADDRESS:}
      name: ${MAIL_FROM_NAME:YXShop}

  # 文件存储配置
  storage:
    driver: local
    local:
      root: /app/public/uploads
    oss:
      access_key_id: ${AWS_ACCESS_KEY_ID:}
      access_key_secret: ${AWS_SECRET_ACCESS_KEY:}
      bucket: ${AWS_BUCKET:}
      region: ${AWS_DEFAULT_REGION:}

  # 监控配置
  monitoring:
    sentry:
      dsn: ${SENTRY_LARAVEL_DSN:}
      traces_sample_rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
    prometheus:
      enabled: true
      port: 9090
      path: /metrics

  # 安全配置
  security:
    jwt:
      secret: ${JWT_SECRET:yxshop_jwt_secret_key}
      ttl: 7200
      refresh_ttl: 604800
    rate_limit:
      api: 100
      login: 5
      register: 3
    cors:
      allowed_origins: "*"
      allowed_methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed_headers: "Content-Type,Authorization,X-Requested-With"
