# 增强版API网关配置
http {
    # 基础配置
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=grpc:10m rate=20r/s;

    # 连接限制
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 10;

    # 文件上传限制
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 代理配置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # 上游服务配置
    upstream auth_service {
        server auth-service:8001 max_fails=3 fail_timeout=30s;
        server auth-service-2:8001 max_fails=3 fail_timeout=30s;
    }

    upstream order_service {
        server order-service:8004 max_fails=3 fail_timeout=30s;
        server order-service-2:8004 max_fails=3 fail_timeout=30s;
    }

    upstream payment_service {
        server payment-service:8006 max_fails=3 fail_timeout=30s;
        server payment-service-2:8006 max_fails=3 fail_timeout=30s;
    }

    upstream inventory_service {
        server inventory-service:8005 max_fails=3 fail_timeout=30s;
        server inventory-service-2:8005 max_fails=3 fail_timeout=30s;
    }

    upstream user_service {
        server user-service:8007 max_fails=3 fail_timeout=30s;
        server user-service-2:8007 max_fails=3 fail_timeout=30s;
    }

    upstream notification_service {
        server notification-service:8003 max_fails=3 fail_timeout=30s;
        server notification-service-2:8003 max_fails=3 fail_timeout=30s;
    }

    upstream tenant_service {
        server tenant-service:8012 max_fails=3 fail_timeout=30s;
    }

    upstream i18n_service {
        server i18n-service:8013 max_fails=3 fail_timeout=30s;
    }

    upstream event_bus_service {
        server event-bus-service:8014 max_fails=3 fail_timeout=30s;
    }

    upstream grpc_service {
        server grpc-service:8015 max_fails=3 fail_timeout=30s;
    }

    # 健康检查配置
    upstream health_check {
        server auth-service:8001;
        server order-service:8004;
        server payment-service:8006;
        server inventory-service:8005;
        server user-service:8007;
        server notification-service:8003;
        server tenant-service:8012;
        server i18n-service:8013;
        server event-bus-service:8014;
        server grpc-service:8015;
    }

    # 主服务器配置
    server {
        listen 80;
        server_name yxadmin.local;

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 详细健康检查
        location /health/detailed {
            access_log off;
            proxy_pass http://health_check/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 认证服务
        location /api/auth/ {
            # 限流
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit_per_ip 5;

            # 安全检查
            include /etc/nginx/conf.d/security.conf;

            # 代理到认证服务
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 订单服务
        location /api/orders/ {
            limit_req zone=api burst=30 nodelay;
            limit_conn conn_limit_per_ip 8;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://order_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 支付服务
        location /api/payments/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit_per_ip 5;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://payment_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 库存服务
        location /api/inventory/ {
            limit_req zone=api burst=25 nodelay;
            limit_conn conn_limit_per_ip 6;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://inventory_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户服务
        location /api/users/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit_per_ip 5;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://user_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 通知服务
        location /api/notifications/ {
            limit_req zone=api burst=15 nodelay;
            limit_conn conn_limit_per_ip 4;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://notification_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 租户服务
        location /api/tenants/ {
            limit_req zone=api burst=15 nodelay;
            limit_conn conn_limit_per_ip 4;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://tenant_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 国际化服务
        location /api/i18n/ {
            limit_req zone=api burst=15 nodelay;
            limit_conn conn_limit_per_ip 4;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://i18n_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 事件总线服务
        location /api/events/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit_per_ip 5;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://event_bus_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # gRPC服务 (HTTP/2)
        location /api/grpc/ {
            limit_req zone=grpc burst=30 nodelay;
            limit_conn conn_limit_per_ip 10;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://grpc_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # gRPC特定配置
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # WebSocket支持
        location /ws/ {
            proxy_pass http://event_bus_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket超时设置
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # 文件上传
        location /api/upload/ {
            limit_req zone=upload burst=5 nodelay;
            limit_conn conn_limit_per_ip 2;

            include /etc/nginx/conf.d/security.conf;

            proxy_pass http://user_service/upload/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # API文档
        location /api/docs/ {
            proxy_pass http://auth_service/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 监控指标
        location /metrics {
            access_log off;
            proxy_pass http://auth_service/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 默认错误页面
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # HTTPS服务器配置
    server {
        listen 443 ssl http2;
        server_name yxadmin.local;

        # SSL配置
        ssl_certificate /etc/nginx/ssl/yxadmin.crt;
        ssl_certificate_key /etc/nginx/ssl/yxadmin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 重定向到HTTP配置
        location / {
            proxy_pass http://127.0.0.1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
} 